name: "[DEV]"

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "[DEV] SSH Deploy"
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'dev' }}
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_BRANCH
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/zuvy-eval-server
            BRANCH="${DEPLOY_BRANCH}"
            echo "Deploying branch: ${BRANCH}"
            if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "Invalid branch name: $BRANCH"
              exit 1
            fi
            git fetch --prune origin
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git log -1 --oneline
            docker stop zuvy-eval-server || true
            docker rm zuvy-eval-server || true
            if [ "$BRANCH" = "dev" ]; then
              unset SKIP_EVAL_MIGRATIONS || true
              docker compose up -d --build --force-recreate
            else
              echo "Feature deploy: skipping migrations"
              export SKIP_EVAL_MIGRATIONS=1
              docker compose up -d --build --force-recreate
            fi
            docker compose ps
