name: "[DEV]"

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "[DEV] SSH Deploy"
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'dev' }}
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_BRANCH
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /home/ubuntu/zuvy-eval-server
            BRANCH="${DEPLOY_BRANCH}"
            echo "Deploying branch: ${BRANCH}"
            printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'
            git fetch --prune origin
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git log -1 --oneline
            docker stop zuvy-eval-server || true
            docker rm zuvy-eval-server || true
            SKIP_EVAL_MIGRATIONS=
            [ "$BRANCH" = "dev" ] || SKIP_EVAL_MIGRATIONS=1
            export SKIP_EVAL_MIGRATIONS
            echo "SKIP_EVAL_MIGRATIONS=${SKIP_EVAL_MIGRATIONS:-}"
            docker compose up -d --build --force-recreate
            docker compose ps
