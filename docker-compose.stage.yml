# Staging stack on the same EC2 as dev. Does not replace docker-compose.yml.
#   docker compose -p zuvy-eval-stage -f docker-compose.stage.yml --env-file .env.stage up -d --force-recreate
name: zuvy-eval-stage

services:
  api:
    container_name: zuvy-eval-server-stage
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_VERSION: ${NODE_VERSION:-20.18.0}
    image: ${DOCKER_IMAGE:-zuvy-eval-server}:${DOCKER_TAG:-stage}
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env.stage
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_HOST: 172.31.26.195
      REDIS_PORT: 6379
      BULLMQ_PREFIX: zuvy-eval-stage   # keep isolated from the dev stack sharing this Redis
      # Host network, so this is a port on the server itself and must not clash
      # with anything else running there: 5000 is the eval dev container, and
      # 5001 is Zuvy dev (zuvy_container maps 5001:5000), which is why stage
      # moved off it. Anything calling eval stage must use this port.
      PORT: "5003"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
